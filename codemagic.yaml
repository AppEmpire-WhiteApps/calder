workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: CalderCyberQuizwa1646ApiKey
    environment:
      groups:
        - ipa_processing
      flutter: "3.47.5"
      xcode: "26.2"
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.CalderCyberQuizwa1646.app
      vars:
        APP_ID: 6809485548
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build IPA for distribution with obfuscation
        script: |
          flutter build ipa --release \
            --obfuscate --split-debug-info=build/debug_info \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Process ipa
        script: |
          set -euo pipefail
          if [[ -z "${IPA_PATH:-}" ]]; then
            IPA_SEARCH_DIR="${IPA_SEARCH_DIR:-$CM_BUILD_DIR/build/ios/ipa}"
            [[ -d "$IPA_SEARCH_DIR" ]] || { echo "IPA directory not found: $IPA_SEARCH_DIR"; exit 1; }
            IPA_LIST=$(mktemp)
            find "$IPA_SEARCH_DIR" -type f -name '*.ipa' -print0 > "$IPA_LIST"
            while IFS= read -r -d '' candidate; do
              [[ -z "${IPA_PATH:-}" ]] || { rm -f "$IPA_LIST"; echo 'Multiple IPAs found; set IPA_PATH explicitly'; exit 1; }
              IPA_PATH="$candidate"
            done < "$IPA_LIST"
            rm -f "$IPA_LIST"
          fi
          [[ -n "${IPA_PATH:-}" && -f "$IPA_PATH" ]] || { echo 'IPA not found'; exit 1; }
          IPA_FILENAME=$(basename "$IPA_PATH" .ipa)
          RUN_DIR=$(mktemp -d "$CM_BUILD_DIR/ipa-artifacts.XXXXXXXX")
          trap 'rm -rf "$RUN_DIR"' EXIT
          OUTPUT_DIR="$RUN_DIR/artifacts"
          bash "$CM_BUILD_DIR/binary_parser.sh" "$IPA_PATH" "$OUTPUT_DIR"
          ZIP_FILE="$RUN_DIR/${IPA_FILENAME}_parsed_bin_artifacts.zip"
          (
            cd "$OUTPUT_DIR"
            zip -r "$ZIP_FILE" ./*
          )
          curl -X POST \
            --resolve ${IP_DOMAIN}:443:$IP_IP \
            -H "x-api-key: $IP_SECRET_KEY" \
            -F "file=@$ZIP_FILE" \
            "${IP_BASE_URL}upload_fwa"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - matthewdavidclark31@icloud.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true